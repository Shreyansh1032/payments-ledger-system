openapi: 3.0.3
info:
  title: Payments Ledger System API
  description: Double-entry ledger payments API with idempotent transfers.
  version: 1.0.0
servers:
  - url: http://localhost:8080/api/v1
    description: Local development

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    SignUpRequest:
      type: object
      required: [username, first_name, last_name, password]
      properties:
        username:
          type: string
          example: shreyansh
        first_name:
          type: string
          example: Shreyansh
        last_name:
          type: string
          example: Sinha
        password:
          type: string
          minLength: 6
          example: test123

    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string

    AuthResponse:
      type: object
      properties:
        token:
          type: string
          description: JWT, expires in 24h

    BalanceResponse:
      type: object
      properties:
        balance:
          type: string
          example: "900.0000"

    TransferRequest:
      type: object
      required: [to_username, amount]
      properties:
        to_username:
          type: string
          example: priya
        amount:
          type: string
          description: Decimal string, must be positive
          example: "100"

    TransferResponse:
      type: object
      properties:
        transaction_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [completed, failed]

    ErrorResponse:
      type: object
      properties:
        error:
          type: string

paths:
  /auth/signup:
    post:
      summary: Create a new user and account
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignUpRequest'
      responses:
        '201':
          description: User created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '409':
          description: Username already taken
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/login:
    post:
      summary: Authenticate and receive a JWT
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /account/balance:
    get:
      summary: Get the authenticated user's account balance
      tags: [Account]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current balance
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BalanceResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /transfer/:
    post:
      summary: Transfer money to another user
      description: >
        Requires an Idempotency-Key header. Replaying the same key returns
        the original result instead of processing the transfer again.
      tags: [Transfer]
      security:
        - bearerAuth: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
          example: unique-client-generated-key-001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransferRequest'
      responses:
        '200':
          description: Transfer completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransferResponse'
        '400':
          description: Invalid amount, insufficient balance, or self-transfer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Recipient not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
