apiVersion: batch/v1
kind: Job
metadata:
  name: db-migrate
  namespace: paywave
spec:
  backoffLimit: 3
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: shreyanshsinha/payments-ledger-migrator:v1.0.0
          args: ["-path=/migrations", "-database=$(DATABASE_URL)", "up"]
          envFrom:
            - secretRef:
                name: app-secret
